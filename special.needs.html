<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="PP.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>Special Needs - Wellnesti</title>
</head>
<body class="home">

    <header>
        <nav class="navbar">
            <ul class="list"> 
                <li class="newpet"><a href="add.new.html"><img src="Images/image 6.png"></a></li>
                <li class="activity"><a href=activities.html><img src="Images/ball.png" class="activity-icon"></a></li>
                <li class="special"><a href=special.needs.html><img src="images/pill.png" class="special-icon" alt="Special Needs Icon"></a></li>
                <li class="stats"><a href="stats.html"><img src="images/stats.png" class="stats-icon"></a></li>
                <li class="settings"><a href=settings.html><img src="images/gear.png" class="gear-icon" alt="Settings"></a></li>
             </ul>
        </nav>
    </header>
                        <section class="add-new">
                        <button class="add-event">Add Event</button>
                        </section>
                        <div id="modalOverlay" class="modal-overlay hidden">
                            <div class="modal">
                              <h2>New Activity</h2>
                        
                              <form id="activityForm">
                                <label>Activity Type</label>
                                <input id="activityType" placeholder="Walk, Feeding, Vet Visit..." required />
                        
                                <label>Date</label>
                                <input id="activityDate" type="date" required />
                        
                                <label>Notes</label>
                                <textarea id="activityNotes" placeholder="Optional"></textarea>
                        
                                <div class="modal-buttons">
                                  <button type="submit">Add Activity</button>
                                  <button type="button" id="closeModalBtn">Cancel</button>
                                </div>
                              </form>
                            </div>
                          </div>
                          <ul id="activityList" class="activity-list"></ul>
                          <script src="Pal.js"></script>
</body>
